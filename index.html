<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harvest Field Gospel Mission Int'l — Taking the Nations for Christ</title>
    <meta name="description" content="Harvest Field Gospel Mission Int'l (Omoku, Rivers State, Nigeria) — Evangelism, Youth & School Outreaches, Discipleship, and Rural & Foreign Missions led by Evang. David Abrebor." />
    <meta property="og:title" content="Harvest Field Gospel Mission Int'l — Taking the Nations for Christ" />
    <meta property="og:description" content="A fellowship of kingdom-minded believers equipped for rural and foreign missions across Nigeria, Cameroon, Tchad Republic, and Côte d'Ivoire." />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://harvestfieldgospelmisson.pages.dev/" />
    <meta name="theme-color" content="#08283b" />
    <meta name="color-scheme" content="light" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      #hf-initial-loader {
        position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
        padding: 24px; background: linear-gradient(160deg, #08283b 0%, #0b3944 55%, #101f34 100%); color: #fff; opacity: 1; visibility: visible;
        transition: opacity 280ms ease, visibility 280ms ease;
      }
      #hf-initial-loader.hf-loader--hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .hf-loader-content { display: flex; width: min(100%, 360px); flex-direction: column; align-items: center; text-align: center; }
      .hf-loader-mark { display: block; width: min(250px, 72vw); max-height: 120px; height: auto; object-fit: contain; filter: grayscale(1) brightness(0) invert(1); }
      .hf-loader-message { margin: 24px 0 0; color: #ffc400; font-family: "Plus Jakarta Sans",sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
      .hf-loader-progress { width: 168px; height: 2px; margin-top: 17px; overflow: hidden; background: rgba(255,255,255,.18); }
      .hf-loader-progress span { display: block; width: 12%; height: 100%; background: #ffc400; animation: hf-loader-progress 1.35s ease-in-out infinite; }
      @keyframes hf-loader-progress { 0% { transform: translateX(-100%); } 50% { transform: translateX(400%); } 100% { transform: translateX(1400%); } }
      @media (prefers-reduced-motion: reduce) { .hf-loader-progress span { animation: none; } #hf-initial-loader { transition: none; } }
    </style>
  </head>
  <body>
    <div id="hf-initial-loader" role="status" aria-live="polite" aria-label="Loading Harvest Field Gospel Mission International">
      <div class="hf-loader-content">
        <img class="hf-loader-mark" src="/assets/harvest-field-logo.png" alt="Harvest Field Gospel Mission International" fetchpriority="high" />
        <p class="hf-loader-message">Loading Harvest Field</p>
        <div class="hf-loader-progress" aria-hidden="true"><span></span></div>
      </div>
    </div>

    <form name="contact-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="reply_contact" />
      <input name="topic" />
      <textarea name="message"></textarea>
    </form>
    <form name="join-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="join-interest" />
      <input name="bot-field" />
      <input name="full_name" />
      <input name="phone" />
      <input type="email" name="email" />
      <input name="state" />
      <input name="local_government_area" />
      <input name="area_of_interest" />
      <textarea name="motivation"></textarea>
    </form>
    <form name="prayer-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="prayer-request" />
      <input name="bot-field" />
      <input name="name" />
      <input name="reply_contact" />
      <textarea name="prayer_request"></textarea>
      <input name="permission_to_follow_up" />
    </form>

    <form name="ministry-invitation" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ministry-invitation" />
      <input name="bot-field" />
      <input name="organization" />
      <input name="coordinator-contact" />
      <select name="program-type"><option>Missions / Evangelistic Conference</option></select>
      <input name="proposed-location-and-dates" />
      <textarea name="program-details"></textarea>
    </form>
    <form name="mission-partnership" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="mission-partnership" />
      <input name="bot-field" />
      <input name="name" />
      <input name="reply_contact" />
      <input name="interest" />
      <input name="location" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
