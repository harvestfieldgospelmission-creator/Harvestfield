<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0a2216" />
  <title>Website Temporarily Unavailable</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 24px; background: #081d14; color: #faf8f4;
      font-family: Arial, Helvetica, sans-serif; text-align: center;
    }
    main { width: min(100%, 560px); padding: 48px 28px; }
    .mark { width: 54px; height: 4px; margin: 0 auto 30px; border-radius: 9px; background: #b88735; }
    h1 { margin: 0 0 16px; font-size: clamp(28px, 6vw, 42px); line-height: 1.15; }
    p { margin: 0; color: #d4ddd6; font-size: 16px; line-height: 1.8; }
    .small { margin-top: 28px; color: #aab9af; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Website Temporarily Unavailable</h1>
    <p>This website is temporarily offline. Please check back later.</p>
    <p class="small">Thank you for your understanding.</p>
  </main>
</body>
</html>
