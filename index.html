<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harvest Field Gospel Mission Int'l — Taking the Nations for Christ</title>
    <meta name="description" content="Harvest Field Gospel Mission Int'l (Omoku, Rivers State, Nigeria) — Evangelism, Youth & School Outreaches, Discipleship, and Rural & Foreign Missions led by Evang. David Abrebor." />
    <meta property="og:title" content="Harvest Field Gospel Mission Int'l — Taking the Nations for Christ" />
    <meta property="og:description" content="A fellowship of kingdom-minded believers equipped for rural and foreign missions across Nigeria, Cameroon, Tchad Republic, and Côte d'Ivoire." />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://harvestfieldgospelmission.netlify.app/" />
    <meta name="theme-color" content="#0a2216" />
    <meta name="color-scheme" content="light" />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <form name="contact-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="reply_contact" />
      <input name="topic" />
      <textarea name="message"></textarea>
    </form>
    <form name="join-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="join-interest" />
      <input name="bot-field" />
      <input name="full_name" />
      <input name="phone" />
      <input type="email" name="email" />
      <input name="state" />
      <input name="local_government_area" />
      <input name="area_of_interest" />
      <textarea name="motivation"></textarea>
    </form>
    <form name="prayer-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="prayer-request" />
      <input name="bot-field" />
      <input name="name" />
      <input name="reply_contact" />
      <textarea name="prayer_request"></textarea>
      <input name="permission_to_follow_up" />
    </form>

    <form name="ministry-invitation" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="ministry-invitation" />
      <input name="bot-field" />
      <input name="organization" />
      <input name="coordinator-contact" />
      <select name="program-type"><option>Missions / Evangelistic Conference</option></select>
      <input name="proposed-location-and-dates" />
      <textarea name="program-details"></textarea>
    </form>
    <form name="mission-partnership" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="mission-partnership" />
      <input name="bot-field" />
      <input name="name" />
      <input name="reply_contact" />
      <input name="interest" />
      <input name="location" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
