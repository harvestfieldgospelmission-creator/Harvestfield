    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(30px, 6vw, 42px); }
    p { color: #57534e; line-height: 1.7; }
    a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 14px; padding: 0 22px; border-radius: 8px; background: #173b28; color: white; font-weight: 600; text-decoration: none; }

</head>

  <main>
    <div class="mark" aria-hidden="true">✓</div>
