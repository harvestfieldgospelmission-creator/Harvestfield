name: Website validation

on:
  pull_request:
    branches:
      - main
      - review/website-integration
  push:
    branches:
      - review/website-integration

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build production site
        run: npm run build
      - name: Install Sanity Studio dependencies
        run: npm install --no-audit --no-fund
        working-directory: studio
      - name: Build Sanity Studio
        run: npm run build
        working-directory: studio
